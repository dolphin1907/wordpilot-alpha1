<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordPilot Alpha</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#f5f7fb;
}

header{
  background:#2563eb;
  color:white;
  text-align:center;
  padding:20px;
  font-size:24px;
  font-weight:bold;
}

.card{
  background:white;
  margin:20px;
  padding:24px;
  border-radius:20px;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.domain{
  color:#666;
  font-size:13px;
  margin-bottom:10px;
}

.phrase{
  font-size:30px;
  font-weight:bold;
  margin-bottom:16px;
}

.meaning{
  font-size:22px;
  color:#2563eb;
  margin-bottom:20px;
}

.example{
  color:#444;
  line-height:1.5;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:25px;
}

button{
  flex:1;
  border:none;
  padding:14px;
  border-radius:12px;
  font-size:16px;
  color:white;
}

.learn{
  background:#f59e0b;
}

.know{
  background:#22c55e;
}

.save{
  background:#2563eb;
}

.bottom{
  position:fixed;
  bottom:0;
  width:100%;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
}

.tab{
  flex:1;
  text-align:center;
  padding:16px;
}

.hidden{
  display:none;
}

ul{
  padding-left:20px;
}
</style>
</head>

<body>

<header>
WordPilot Alpha
</header>

<div id="discover">

<div class="card">

<div class="domain">
SOCIAL STARTER PACK
</div>

<div class="phrase" id="phrase">
How have you been?
</div>

<div class="meaning" id="meaning">
Nasılsın?
</div>

<div class="example" id="example">
Hey Alex, how have you been?
</div>

<div class="buttons">

<button class="learn" onclick="learnPhrase()">
Learn
</button>

<button class="know" onclick="nextPhrase()">
Know
</button>

<button class="save" onclick="savePhrase()">
Save
</button>

</div>

</div>

</div>

<div id="vocabulary" class="hidden">

<div class="card">

<h2>Vocabulary</h2>

<ul id="vocabularyList"></ul>

</div>

</div>

<div class="bottom">

<div class="tab" onclick="showDiscover()">
Discover
</div>

<div class="tab" onclick="showVocabulary()">
Vocabulary
</div>

</div>

<script>

const phrases = [

{
 phrase:"How have you been?",
 meaning:"Nasılsın?",
 example:"Hey Alex, how have you been?"
},

{
 phrase:"What have you been up to?",
 meaning:"Neler yapıyordun?",
 example:"What have you been up to lately?"
},

{
 phrase:"Nice to meet you.",
 meaning:"Tanıştığıma memnun oldum.",
 example:"Nice to meet you. My name is Alex."
},

{
 phrase:"Where are you from?",
 meaning:"Nerelisin?",
 example:"Where are you from originally?"
},

{
 phrase:"What do you do for a living?",
 meaning:"Ne iş yapıyorsun?",
 example:"What do you do for a living?"
},

{
 phrase:"That sounds interesting.",
 meaning:"Kulağa ilginç geliyor.",
 example:"That sounds interesting."
},

{
 phrase:"Really?",
 meaning:"Gerçekten mi?",
 example:"Really? That's amazing."
},

{
 phrase:"No way!",
 meaning:"Yok artık!",
 example:"No way! I can't believe it."
},

{
 phrase:"I totally agree.",
 meaning:"Tamamen katılıyorum.",
 example:"I totally agree with you."
},

{
 phrase:"That makes sense.",
 meaning:"Mantıklı.",
 example:"That makes sense."
}

];

let currentIndex = 0;

let vocabulary = [];

function render(){

document.getElementById("phrase").innerText =
phrases[currentIndex].phrase;

document.getElementById("meaning").innerText =
phrases[currentIndex].meaning;

document.getElementById("example").innerText =
phrases[currentIndex].example;
}

function nextPhrase(){

currentIndex++;

if(currentIndex>=phrases.length){
currentIndex=0;
}

render();
}

function learnPhrase(){

vocabulary.push(
"📚 " +
phrases[currentIndex].phrase
);

refreshVocabulary();

nextPhrase();
}

function savePhrase(){

vocabulary.push(
"⭐ " +
phrases[currentIndex].phrase
);

refreshVocabulary();

nextPhrase();
}

function refreshVocabulary(){

const list =
document.getElementById(
"vocabularyList"
);

list.innerHTML = "";

vocabulary.forEach(item=>{

const li =
document.createElement("li");

li.innerText = item;

list.appendChild(li);

});
}

function showDiscover(){

document
.getElementById("discover")
.classList.remove("hidden");

document
.getElementById("vocabulary")
.classList.add("hidden");
}

function showVocabulary(){

document
.getElementById("discover")
.classList.add("hidden");

document
.getElementById("vocabulary")
.classList.remove("hidden");
}

render();

</script>

</body>
</html>
